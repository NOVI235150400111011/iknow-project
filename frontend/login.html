<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>iKnow - Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="login-wrapper">
    <div class="login-center">
      <div class="login-card">
        <img src="assets/images/fifgroup-logo.jpg" alt="FIFGROUP" class="login-logo">

        <h1 class="login-title">iKnow</h1>
        <p class="login-subtitle">Face Similiarity Scoring System</p>

        <form id="login-form">
          <input type="password" id="password" placeholder="Password" required autofocus>
          <button type="submit" id="login-btn">Masuk</button>
        </form>
        <p class="error-message" id="error-msg"></p>
      </div>
    </div>

    <div class="login-footer">
      <span>Supported By FIFGROUP YOUNG LEADER</span>
      <span>Made by Novi Maharani</span>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="login.js"></script>
</body>
</html>
